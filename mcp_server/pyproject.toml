[project]
name = "blender-for-me"
version = "0.0.1-beta"
description = "MCP server giving AI agents deep control of Blender via a loopback bridge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27",
]

[project.scripts]
blender-agent-mcp = "blender_agent_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_agent_mcp"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["src"]
